			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n# The script runs in every config, but we only enforce on release-\n# type builds (Release / AppStore). Debug builds print a \"skipped\"\n# line so the trace stays consistent across configurations.\nif [[ \"$CONFIGURATION\" == \"Debug\" ]]; then\n  echo \"⏭  [P23] skipping release gate in Debug — demo character is available\"\n  echo \"    (set DESKPET_FORCE_DEFAULT_CHARACTER=1 at launch to use the\"\n  echo \"     production 'hatched-girl' character in Debug.)\"\n  exit 0\nfi\necho \"🔒 [P23] checking that the demo 'Fluffy Wintery Kitty' character\"\necho \"    is not bundled in $CONFIGURATION\"\n# We check by demo-specific file basenames rather than by directory\n# structure, because Xcode's Copy Resources phase flattens the\n# `Resources/` source folder into the bundle root. The demo\n# assets are uniquely named (`fluffy_*` + `fluffy_demo_*`) so a\n# single grep is enough — and `LumiScholar`, `HatchedGirl`,\n# `default_character_animation.json` etc. are not flagged.\nAPP_RES=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nHITS=\"$(find \"$APP_RES\" -type f \\( -name 'fluffy_demo_character_animation.json' -o -name 'fluffy_idle_main.png' -o -name 'fluffy_react_*.png' \\) 2>/dev/null || true)\"\nif [[ -n \"$HITS\" ]]; then\n  echo \"❌ [P23] demo 'Fluffy Wintery Kitty' character assets are bundled in $CONFIGURATION.\"\n  echo \"    This model is licensed '仅适用于 vts / 禁止使用本模型生成AI / 不允许一皮多用'\"\n  echo \"    and must NOT ship in a release build.\"\n  echo \"\"\n  echo \"    Hits:\"\n  echo \"$HITS\" | sed 's/^/      /'\n  echo \"\"\n  echo \"    Fix:\"\n  echo \"      rm -rf '$SRCROOT/Resources/Characters/FluffyDemo'\"\n  echo \"      rm    '$SRCROOT/Resources/CharacterAnimation/fluffy_demo_character_animation.json'\"\n  echo \"\"\n  echo \"    (the same assets are still loadable in Debug — the gate only\"\n  echo \"     fires for Release / AppStore configs.)\"\n  exit 1\nfi\necho \"✅ [P23] demo character assets not bundled ($CONFIGURATION, release-safe)\"\n";
		};
